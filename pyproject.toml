[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ccia-core"
version = "3.0.0"
authors = [
  { name="strias-ai", email="striaz@unisant.edu.mx" },
]
description = "Sovereign Agent Framework: Immunity, A2A Protocol, and Micro-SaaS Monetization"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pyjwt>=2.8.0",
]

[project.urls]
"Homepage" = "https://github.com/strias-ai/ccia-swarm"
"Bug Tracker" = "https://github.com/strias-ai/ccia-swarm/issues"
